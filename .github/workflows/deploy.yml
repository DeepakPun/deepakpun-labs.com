name: CI/CD Portfolio Auto-Deploy
on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Client
        uses: docker/build-push-action@v5
        with:
          context: ./services/client
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-client:sha-${{ github.sha }}

      - name: Build and Push Core API
        uses: docker/build-push-action@v5
        with:
          context: ./services/core-api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-core-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-core-api:sha-${{ github.sha }}

      - name: Build and Push Docs
        uses: docker/build-push-action@v5
        with:
          context: ./services/docs
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-docs:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-docs:sha-${{ github.sha }}

  deploy-to-droplet:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate.env
        run: printf '%s' "${{ secrets.PROD_ENV_FILE }}" >.env

      - name: Copy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "compose.yaml,run.sh,nginx.conf,.env,.github/scripts/maintenance.sh"
          target: "/root/portfolio"

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /root/portfolio
            chmod +x run.sh.github/scripts/maintenance.sh
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            ./run.sh prod
            docker compose exec -T nginx nginx -s reload
            echo "✅ Live at https://deepakpun-labs.com"

services:
  client:
    image: pundeepak/portfolio-client:${IMAGE_TAG:-latest}
    ports: ["3000:3000"]

  core-api:
    image: pundeepak/portfolio-core-api:${IMAGE_TAG:-latest}
    ports: ["3001:3001"]
    env_file: [.env]
    volumes: [./.env:/app/.env:ro]
    depends_on:
      mongo: { condition: service_healthy }

  mongo:
    image: mongo:latest
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    expose: ["27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval "db.adminCommand(''ping'')" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:alpine-slim
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /root/portfolio/certbot_etc:/etc/letsencrypt:ro
      - /root/portfolio/certbot_www:/var/www/certbot:ro
    depends_on: [client, core-api]

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    # networks:
    #   - deepakpun-labs-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    # networks:     # Not necessary if we are using the default network
    #   - deepakpun-labs-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://deepakpun-labs.com/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - deepakpun-labs-network

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:

# networks:
#   default:
#     name: deepakpun-labs-network

services:
  client:
    image: pundeepak/portfolio-client:${IMAGE_TAG:-latest}
    ports: ["3000:3000"]

  core-api:
    image: pundeepak/portfolio-core-api:${IMAGE_TAG:-latest}
    ports: ["3001:3001"]
    env_file: [.env]
    volumes: [./.env:/app/.env:ro]
    depends_on:
      mongo: { condition: service_healthy }

  mongo:
    image: mongo:latest
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    expose: ["27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval "db.adminCommand(''ping'')" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:alpine-slim
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /root/portfolio/certbot_etc:/etc/letsencrypt:ro
      - /root/portfolio/certbot_www:/var/www/certbot:ro
    depends_on: [client, core-api]

volumes: { mongo_data: }

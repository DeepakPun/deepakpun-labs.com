# 80 -> redirect to https apex
server {
    listen 80;
    server_name deepakpun-labs.com www.deepakpun-labs.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://deepakpun-labs.com$request_uri; }
}

# 443 www -> redirect to apex
server {
    listen 443 ssl;
    server_name www.deepakpun-labs.com;
    ssl_certificate /etc/letsencrypt/live/deepakpun-labs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deepakpun-labs.com/privkey.pem;
    return 301 https://deepakpun-labs.com$request_uri;
}

# 443 apex -> real app
server {
    listen 443 ssl;
    server_name deepakpun-labs.com;

    ssl_certificate /etc/letsencrypt/live/deepakpun-labs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deepakpun-labs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # API - core-api handles CORS, nginx just proxies
    location /api/ {
        proxy_pass http://core-api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ALSO proxy your non-/api routes that belong to core-api
    # If your core-api routes are /theories, /auth, etc, add them:
    location ~ ^/(theories|users|auth|posts)/ {
        proxy_pass http://core-api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs/ {
        proxy_pass http://docs:80/;
    }
    location = /docs { return 301 /docs/; }

    location / {
        proxy_pass http://client:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}